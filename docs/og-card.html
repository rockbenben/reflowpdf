<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      #card {
        width: 1200px; height: 630px;
        background: linear-gradient(135deg, #1f3a8a 0%, #2563eb 55%, #3b82f6 100%);
        color: #fff; padding: 72px 80px;
        font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
        display: flex; flex-direction: column; justify-content: space-between;
        position: relative; overflow: hidden;
      }
      .glyph { position: absolute; right: 56px; top: 40px; font-size: 280px; opacity: 0.16; line-height: 1; }
      .brand { font-size: 88px; font-weight: 800; letter-spacing: -0.02em; }
      .accent { width: 96px; height: 8px; background: #ffffff; border-radius: 4px; margin: 20px 0 28px; opacity: .9; }
      .tag { font-size: 40px; font-weight: 600; line-height: 1.35; max-width: 760px; }
      .sub { font-size: 26px; opacity: .9; margin-top: 18px; max-width: 820px; line-height: 1.4; }
      .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; opacity: .92; }
      .pill { background: rgba(255,255,255,.18); padding: 10px 22px; border-radius: 999px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="glyph">📱</div>
      <div>
        <div class="brand">ReflowPDF</div>
        <div class="accent"></div>
        <div class="tag">把 PDF 放大 / 重排,方便手机阅读</div>
        <div class="sub">纯浏览器本地转换,文件不上传 · 引擎 k2pdfopt 编译为 WebAssembly</div>
      </div>
      <div class="foot">
        <span>github.com/rockbenben/reflowpdf</span>
        <span class="pill">100% client-side · WASM</span>
      </div>
    </div>
  </body>
</html>
