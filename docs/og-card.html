<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ReflowPDF social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      ReflowPDF social card — 1200×630, rendered with the html-shot skill:
        node <html-shot>/render.mjs docs/og-card.html docs/og-image.png

      Two rules this card is built to:
      1. Nothing is smaller than 40px. A social card is really seen at ~440px wide
         (0.367×), and 40px is what still reads there. Anything below that is
         decoration, so it carries no message.
      2. Layout is in normal flow. The previous version absolutely positioned its
         footer over vertically-centred content and the lines collided.

      Copy is the four blocks marked COPY below; swap them for another language
      and nothing else changes. Colours are the DESIGN.md tokens and nothing else.
    -->
    <style>
      :root {
        --bg: #eef1f3;
        --panel: #ffffff;
        --graphite: #141a1e;
        --graphite-2: #4a555c;
        --muted: #646e75;
        --line: #d3dade;
        --lens: #1466b3;
        --reticle: #c43a31;
        --disp: "Space Grotesk", "Inter", system-ui, sans-serif;
        --body: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; position: relative; overflow: hidden;
        background: var(--bg); color: var(--graphite); font-family: var(--body);
        padding: 78px 72px 40px;
        display: flex; flex-direction: column; justify-content: space-between;
        -webkit-font-smoothing: antialiased;
      }

      /* instrument ruler, same motif as the site header */
      .ruler { position: absolute; left: 0; right: 0; top: 0; height: 22px; border-bottom: 1px solid var(--line); }
      .ruler::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
        background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 40px 100%;
      }

      .stage { display: flex; align-items: center; gap: 60px; flex: 1; }

      /* ---- left: what it is ---- */
      .say { width: 620px; flex: none; }
      .brand { font-family: var(--disp); font-weight: 700; font-size: 92px; letter-spacing: -0.02em; line-height: 1; }
      .bar { width: 64px; height: 6px; background: var(--lens); border-radius: 3px; margin: 20px 0 26px; }
      .h1 { font-weight: 600; font-size: 58px; line-height: 1.24; letter-spacing: -0.01em; }
      .h1 .hl { color: var(--lens); }
      .sub { font-size: 40px; line-height: 1.3; color: var(--graphite-2); margin-top: 24px; white-space: nowrap; }

      /* ---- right: the mechanism, shown ---- */
      .bench { width: 388px; flex: none; }
      .page {
        position: relative; background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 24px; height: 268px; overflow: hidden;
      }
      /* Dense source columns. Texture on purpose — at feed size it must read as
         "small print", and it carries no message, so it is allowed below the
         40px floor. */
      .specimen {
        font-size: 15px; line-height: 1.66; color: var(--muted); letter-spacing: 0.2px;
        height: 220px; column-count: 2; column-gap: 16px;
      }
      /* Centred over the gutter — that seam between two columns is exactly what
         the lens is reading, so it sits on it instead of hiding it. */
      .loupe {
        position: absolute; left: 104px; top: 52px; width: 180px; height: 180px;
        border-radius: 50%; border: 3px solid var(--graphite); background: var(--panel);
        box-shadow: 0 0 0 8px rgba(20, 26, 30, 0.05), 0 22px 40px -18px rgba(20, 26, 30, 0.5);
        display: flex; align-items: center; justify-content: center;
      }
      .loupe span {
        font-family: var(--disp); font-weight: 700; font-size: 54px; line-height: 1.08;
        color: var(--lens); text-align: center; white-space: nowrap;
      }
      .loupe span i { display: block; font-style: normal; color: var(--graphite); }
      .loupe::after {
        content: ""; position: absolute; right: -14px; bottom: -14px; width: 46px; height: 9px;
        background: var(--graphite); border-radius: 5px; transform: rotate(45deg);
      }
      .formula {
        margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line);
        font-family: var(--mono); font-size: 40px; color: var(--graphite-2);
        display: flex; align-items: baseline; gap: 10px; white-space: nowrap;
      }
      .formula b { font-weight: 500; color: var(--graphite); }
      .formula em { font-style: normal; color: var(--reticle); }

      .foot {
        display: flex; justify-content: space-between; align-items: baseline;
        font-family: var(--mono); font-size: 40px; color: var(--muted);
      }
      .foot .tag { color: var(--graphite-2); }
    </style>
  </head>
  <body>
    <div class="ruler"></div>

    <div class="stage">
      <div class="say">
        <div class="brand">ReflowPDF</div>
        <div class="bar"></div>
        <!-- COPY 1 -->
        <div class="h1">把小字分栏，重新<span class="hl">对焦</span>到手机。</div>
        <!-- COPY 2 -->
        <div class="sub">纯浏览器本地转换，文件不上传</div>
      </div>

      <div class="bench">
        <div class="page">
          <!-- COPY 3 — the source document; texture, not message -->
          <div class="specimen">
            原生放大受几何约束：一个区块被缩放到铺满屏幕宽度时，能变大的倍数只取决于它原本有多窄。半栏宽的区块放大约两倍，满页宽的区块几乎不动。这正是双栏页能干净放大、而单栏页放大不了的原因——也是为什么在手机上让满宽文字变大，靠的是重排，而不是缩放。逐栏放大到铺满手机，或把整页重排成一条大字轨道，图与表整块放大、阅读顺序不变。
          </div>
          <!-- COPY 4 -->
          <div class="loupe"><span>两倍<i>字号</i></span></div>
        </div>
        <div class="formula"><b>字号</b> ≈ <em>屏宽</em> ÷ <em>栏宽</em></div>
      </div>
    </div>

    <div class="foot">
      <span>rockbenben.github.io/reflowpdf</span>
    </div>
  </body>
</html>
